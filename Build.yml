name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Create Cordova Project Wrapper
        run: |
          cordova create myApp com.example.groceryapp "Grocery List"
          cd myApp
          cordova platform add android
          cp ../index.html www/index.html
          cp ../AndroidManifest.xml platforms/android/app/src/main/AndroidManifest.xml
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grocery-apk
          path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
